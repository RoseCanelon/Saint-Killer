services:
  - type: web
    name: saint-killer-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saint-killer-db
          property: connectionString

databases:
  - name: saint-killer-db
    plan: free